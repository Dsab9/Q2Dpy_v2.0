# HEC-RAS calibration site config: Sweetgrass_BT
# Paths in single quotes are literal strings, backslashes and spaces are fine.

hec_version = "641"
EPSG = "EPSG:6514"           # EPSG:6514 NAD83(2011) MT state plane; EPSG:5703 NAVD88 height (m), use geoid2018
gauge_el_NAVD88m = 1192.241

# ---------------------------------------------------------------- run mode
[mode]
cal_observed = false
cal_indirect = false
cal_EG_slope = ""  # MISSING in source config
gen_ratecurv = true
sim_event    = false

# ------------------------------------------------------------- calibration
[calibration]
batch_process      = ""            # MISSING in source; calibrate list of given discharges
create_i0_simplex  = ""            # MISSING in source; only works with Nelder-Mead
algorythm          = ""            # MISSING in source; "Nelder-Mead" | "SCE-UA"
objective_function = ""            # MISSING in source; "RMSE" | "MAE"
max_runs           = 75

structures             = false     # assign channel n to structures in cal_observed (currently assigns channel n to structure)
independent_structures = ""        # MISSING in source; calibrate structures separately from channel; input to simplex same as Q (structures must be true)

set_friction_slope = ""            # MISSING in source; override friction slopes prior to initial run
FS_params = ""                     # MISSING in source; one or both for cal_EG_slope; us_fs must be first if both
upstream_friction_slope   = ""  # MISSING in source config
downstream_friction_slope = ""  # MISSING in source config

Man_n_params = ["Channel"]                    # e.g. Grassland, Road, NoData, Channel, Riparian
Man_n_vals   = [0.045]

Q_params     = ["UpstreamBC"]      # discharge is last in bounds / initial guess
Q_params_cfs = 267.3

# order: (us_fs, ds_fs, landcover_regions, structures, discharge)
bounds   = [[0.015, 0.085]]
i0_guess = [[0.04, 0.05]]

# --------------------------------------------------------------- options
[options]
find_cell_index  = false           # get cell index from WSP coordinates and update csv; must have unique id in ID field
get_inst_q       = false           # grab current reporting discharge for gauge; grabs MaxQ if false
export_shapefile = true            # gen_ratecurv & sim_event: save last inundation shapefile
export_geojsons  = true            # gen_ratecurv & sim_event: save all GeoJSONs (export_shapefile must be true)
verbose = ""  # MISSING in source config

# ------------------------------------------------------------------- paths
[paths]
directory = 'S:\Water_Management\Site Models\43BV 09000 Sweet Grass nr Big Timber\HECRAS'
# RAS_files, GIS, GIS/GeoJSONs, Input, Output are derived from `directory`

# ------------------------------------------------------------ RAS project
[ras]
prj  = ""  # MISSING in source config
geom = ""  # MISSING in source config
flow = "u02"
plan = "p02"
landcover = 'Land Classification\LandCover.hdf'   # relative to RAS_files

[inputs]
grid_filename  = "flow_area.shp"          # GIS/   - for finding cell only
terrain_raster = "ras_terrain.tif"        # GIS/   - template for exporting WSEs
wse_filename   = ""                       # MISSING in source; Input/
trendline      = ""                       # MISSING in source; Input/
q_list         = ""                       # MISSING in source; Input/

[outputs]
simplex_filename      = "simplex_dataframe.csv"
iterations_filename   = "model_iterations.csv"
wse_prof_filename     = "wse_profiles_output.csv"
rating_curve_filename = "rating_curve.csv"
batch_filename        = ""  # MISSING in source config

# --------------------------------------------------- gen_ratecurv settings
[ratecurve]
use_Q_list      = true             # use csv list of discharges from Input instead of generating its own
min_cfs         = 0
max_cfs         = 6700             # also used for sim_event
q_divisions     = 67               # number of runs; 1 = single event based on q
adjust_n_rating = ""               # MISSING in source; adjust n by discharge using a, b and trend params (log recommended)
n_regions       = ""  # MISSING in source config
function_type   = ""               # MISSING in source; linear, log, exp, power, hyper (x is metric)
a     = ""  # MISSING in source config
b     = ""  # MISSING in source config
max_n = ""  # MISSING in source config
min_n = ""  # MISSING in source config

# ------------------------------------------------------ sim_event settings
[sim_event]
hydrograph_ramp = false            # true: ramp q up, hold last hour at max; false: constant q
change_sim_time = false            # change sim time based on 15 min increments
sim_time_hr     = 3                # min 1 hr
set_datetime    = false            # true enables the settings below
start_date = "07JUN2023"
start_time = "00:00"
end_date   = "07JUN2023"
end_time   = "03:00"
computation_interval = "0.5SEC"

# ------------------------------------------------------- labeling bugfix
[labels]
perimeter = "Perimeter"
us_bc = "Upstream BC"
ds_bc = "Downstream BC"
